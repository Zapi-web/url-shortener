- name: Install Argo CD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    release_namespace: argocd
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values: "{{ lookup('file', '../../deploy/platform/values/argo-cd.yaml') | from_yaml }}"
    wait: true
  become: true

- name: Install Argo CD via Helm
  kubernetes.core.helm:
    name: argocd
    chart_ref: argo-cd
    chart_repo_url: https://argoproj.github.io/argo-helm
    release_namespace: argocd
    create_namespace: true
    kubeconfig: /etc/rancher/k3s/k3s.yaml
    values: "{{ lookup('file', '../../deploy/platform/values/argo-cd.yaml') | from_yaml }}"
    wait: true
  become: true
  run_once: true

- name: Apply Prometheus CRDs
  ansible.builtin.command: "kubectl apply --kubeconfig=/etc/rancher/k3s/k3s.yaml -f {{ item }}"
  loop:
    - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_servicemonitors.yaml
    - https://raw.githubusercontent.com/prometheus-operator/prometheus-operator/main/example/prometheus-operator-crd/monitoring.coreos.com_podmonitors.yaml
  become: true
  run_once: true

- name: Copy Argo CD root application manifest
  ansible.builtin.copy:
    src: root-application.yaml
    dest: /tmp/argo-root-app.yaml
    mode: '0644'
  become: true
  run_once: true

- name: Apply Argo CD Root Bootstrap Application
  ansible.builtin.command: "kubectl apply --kubeconfig=/etc/rancher/k3s/k3s.yaml -f /tmp/argo-root-app.yaml"
  become: true
  run_once: true