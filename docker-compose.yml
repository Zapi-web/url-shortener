version: '3.8'

services:
  go:
    build: .
    ports:
      - "8080:8080"
    container_name: url-shortener-test
    environment:
      - PORT=8080
      - NODE_ID=1
      - LOG_LEVEL=debug
      - DATABASE_TTL=1h
      - CONNECTION_STRING=postgres://postgres:password@db:5432/postgres?sslmode=disable
      - REDIS_ADDRS=cache:6379
      - AUTO_MIGRATE=true
      - ENABLE_TRACES=true
      - COLLECTOR_ADDR=jaeger:4317
      - TRACER_RATIO=1.0
    depends_on:
          db:
            condition: service_healthy
          cache:
            condition: service_healthy

  db:
    image: postgres:18-alpine
    container_name: postgres-test
    environment:
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 5
  
  cache:
      image: redis:8-alpine
      container_name: redis-test
      ports:
        - "6379:6379"
      healthcheck:
        test: ["CMD", "redis-cli", "ping"]
        interval: 3s
        timeout: 3s
        retries: 5
  
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Web UI
      - "4317:4317"   # OTLP gRPC (для вашего tracer.New)
      - "4318:4318"   # OTLP HTTP
    restart: unless-stopped